name: Build and host tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dp32g030:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned ARM compiler and test dependencies
        run: sudo bash tools/install-container.sh
      - name: Test voice functions, outgoing APRS handoff and LCD rendering with sanitizers
        run: ./tools/test.sh
      - name: Build, verify and package outgoing APRS firmware without receive support
        run: ./tools/build-transport.sh
      - uses: actions/upload-artifact@v4
        with:
          name: uvk6-tx-only
          path: build/tx-only/
